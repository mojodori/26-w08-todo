<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="하루 동안 해야 할 일을 간편하게 기록하고 관리하세요."
    />
    <title>To-Do 리스트</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./style.css" />
    <script src="./script.js" defer></script>
  </head>
  <body class="min-h-screen bg-slate-100 px-4 py-8 text-slate-900 sm:py-12">
    <main class="mx-auto w-full max-w-[500px]">
      <section
        class="rounded-2xl bg-white p-5 shadow-lg shadow-slate-200/70 sm:p-8"
        aria-labelledby="app-title"
      >
        <header class="mb-7">
          <h1 id="app-title" class="text-2xl font-bold tracking-tight sm:text-3xl">
            To-Do 리스트
          </h1>
          <p class="mt-2 text-sm text-slate-500">오늘 할 일을 하나씩 완료해보세요.</p>
        </header>

        <section class="mb-7" aria-label="전체 진행률">
          <p id="progress-text" class="mb-3 text-sm font-medium text-slate-600">
            완료 0 / 전체 0 (0%)
          </p>
          <div
            class="h-3 overflow-hidden rounded-full bg-slate-200"
            role="progressbar"
            aria-label="할 일 완료율"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <div
              id="progress-fill"
              class="h-full w-0 rounded-full bg-indigo-600"
            ></div>
          </div>
        </section>

        <form id="todo-form" class="flex min-w-0 gap-2" novalidate>
          <label class="sr-only" for="todo-input">새 할 일</label>
          <input
            id="todo-input"
            class="min-h-11 min-w-0 flex-1 rounded-lg border border-slate-300 px-3 text-base outline-none transition placeholder:text-slate-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
            type="text"
            maxlength="100"
            placeholder="할 일을 입력하세요"
            autocomplete="off"
          />
          <button
            class="min-h-11 shrink-0 rounded-lg bg-indigo-600 px-4 text-sm font-semibold text-white transition hover:bg-indigo-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2"
            type="submit"
          >
            추가
          </button>
        </form>

        <p
          id="input-error"
          class="mt-2 hidden min-h-5 text-sm text-red-600"
          role="status"
          aria-live="polite"
        ></p>

        <nav class="mt-5 flex gap-2" aria-label="할 일 필터">
          <button
            class="min-h-11 flex-1 rounded-lg bg-indigo-600 px-3 text-sm font-medium text-white transition"
            type="button"
            data-filter="ALL"
            aria-pressed="true"
          >
            전체
          </button>
          <button
            class="min-h-11 flex-1 rounded-lg px-3 text-sm font-medium text-slate-600 transition hover:bg-slate-100"
            type="button"
            data-filter="ACTIVE"
            aria-pressed="false"
          >
            진행 중
          </button>
          <button
            class="min-h-11 flex-1 rounded-lg px-3 text-sm font-medium text-slate-600 transition hover:bg-slate-100"
            type="button"
            data-filter="COMPLETED"
            aria-pressed="false"
          >
            완료
          </button>
        </nav>

        <ul id="todo-list" class="mt-5 space-y-2" aria-label="할 일 목록"></ul>
        <p
          id="empty-state"
          class="hidden min-h-32 items-center justify-center px-4 text-center text-sm text-slate-500"
        ></p>
      </section>
    </main>
  </body>
</html>
