<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="하루 동안 해야 할 일을 간편하게 기록하고 관리하세요."
    />
    <title>To-Do 리스트</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./style.css" />
    <script src="./script.js" defer></script>
  </head>
  <body class="min-h-screen bg-rose-50 px-4 py-8 text-slate-900 sm:py-12">
    <main class="mx-auto w-full max-w-[500px]">
      <section
        class="app-shell rounded-2xl bg-white p-5 shadow-lg sm:p-8"
        aria-labelledby="app-title"
      >
        <header class="mb-7">
          <h1
            id="app-title"
            class="text-2xl font-bold tracking-tight text-rose-950 sm:text-3xl"
          >
            To-Do 리스트
          </h1>
          <p class="mt-2 text-sm text-rose-700">오늘 할 일을 하나씩 완료해보세요.</p>
        </header>

        <section class="mb-7" aria-label="전체 진행률">
          <p id="progress-text" class="mb-3 text-sm font-medium text-rose-900">
            완료 0 / 전체 0 (0%)
          </p>
          <div
            class="h-3 overflow-hidden rounded-full bg-rose-100"
            role="progressbar"
            aria-label="할 일 완료율"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <div
              id="progress-fill"
              class="h-full w-0 rounded-full bg-rose-400"
            ></div>
          </div>
        </section>

        <form id="todo-form" class="min-w-0" novalidate>
          <label class="sr-only" for="todo-input">새 할 일</label>
          <div class="flex min-w-0 gap-2">
            <input
              id="todo-input"
              class="min-h-11 min-w-0 flex-1 rounded-lg border border-rose-200 bg-white px-3 text-base outline-none transition placeholder:text-rose-300 focus:border-rose-400 focus:ring-2 focus:ring-rose-100"
              type="text"
              maxlength="100"
              placeholder="할 일을 입력하세요"
              autocomplete="off"
            />
            <button
              class="min-h-11 shrink-0 rounded-lg bg-rose-400 px-4 text-sm font-semibold text-white transition hover:bg-rose-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-rose-400 focus-visible:ring-offset-2"
              type="submit"
            >
              추가
            </button>
          </div>
          <div class="mt-3 flex items-center gap-2">
            <label class="text-sm font-medium text-rose-900" for="todo-due-date">
              마감일
            </label>
            <input
              id="todo-due-date"
              class="min-h-11 rounded-lg border border-rose-200 bg-white px-3 text-sm text-rose-900 outline-none transition focus:border-rose-400 focus:ring-2 focus:ring-rose-100"
              type="date"
            />
            <span class="text-xs text-rose-500">선택 사항</span>
          </div>
        </form>

        <p
          id="input-error"
          class="mt-2 hidden min-h-5 text-sm text-red-600"
          role="status"
          aria-live="polite"
        ></p>

        <nav class="mt-5 flex gap-2" aria-label="할 일 필터">
          <button
            class="min-h-11 flex-1 rounded-lg border border-rose-400 bg-rose-400 px-3 text-sm font-medium text-white transition"
            type="button"
            data-filter="ALL"
            aria-pressed="true"
          >
            전체
          </button>
          <button
            class="min-h-11 flex-1 rounded-lg border border-rose-200 px-3 text-sm font-medium text-rose-800 transition hover:bg-rose-50"
            type="button"
            data-filter="ACTIVE"
            aria-pressed="false"
          >
            진행 중
          </button>
          <button
            class="min-h-11 flex-1 rounded-lg border border-rose-200 px-3 text-sm font-medium text-rose-800 transition hover:bg-rose-50"
            type="button"
            data-filter="COMPLETED"
            aria-pressed="false"
          >
            완료
          </button>
        </nav>

        <ul id="todo-list" class="mt-5 space-y-2" aria-label="할 일 목록"></ul>
        <p
          id="empty-state"
          class="hidden min-h-32 items-center justify-center px-4 text-center text-sm text-rose-700"
        ></p>
      </section>
    </main>

    <dialog
      id="delete-dialog"
      class="delete-dialog"
      aria-labelledby="delete-dialog-title"
      aria-describedby="delete-dialog-message"
    >
      <div class="delete-dialog__content">
        <svg
          class="mx-auto mb-3 h-20 w-20"
          viewBox="0 0 96 96"
          role="img"
          aria-label="금빛 장식에 둘러싸인 슬픈 얼굴 그림"
        >
          <circle
            cx="48"
            cy="48"
            r="45"
            fill="#fff4d6"
            stroke="#d6a94f"
            stroke-width="3"
          />
          <path d="M14 31 24 16l8 12 9-17 8 18 13-14 3 19Z" fill="#e8c66a" />
          <path d="M20 65c2-18 13-29 28-29s26 11 28 29L64 81H31Z" fill="#7c5b4b" />
          <ellipse cx="48" cy="54" rx="17" ry="20" fill="#f6d2ad" />
          <path
            d="M38 51h5m10 0h5"
            stroke="#493a37"
            stroke-linecap="round"
            stroke-width="3"
          />
          <path
            d="M43 64q5-4 10 0"
            fill="none"
            stroke="#8b4b4b"
            stroke-linecap="round"
            stroke-width="2.5"
          />
          <path
            d="M35 57q-4 5 0 10m26-10q4 5 0 10"
            fill="none"
            stroke="#7bb7c9"
            stroke-linecap="round"
            stroke-width="3"
          />
          <circle cx="20" cy="53" r="4" fill="#e4a0a9" />
          <circle cx="76" cy="53" r="4" fill="#e4a0a9" />
          <path d="m14 76 5-4 5 4-5 4Zm58-1 5-4 5 4-5 4Z" fill="#d6a94f" />
        </svg>
        <h2 id="delete-dialog-title" class="text-lg font-bold text-rose-950">
          정말 삭제할까요?
        </h2>
        <p id="delete-dialog-message" class="mt-2 break-words text-sm text-rose-800"></p>
        <form method="dialog" class="mt-5 flex justify-center gap-2">
          <button
            class="min-h-11 rounded-lg border border-rose-200 px-4 text-sm font-semibold text-rose-800 transition hover:bg-rose-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-rose-300"
            type="submit"
            value="cancel"
          >
            취소
          </button>
          <button
            class="min-h-11 rounded-lg bg-rose-500 px-4 text-sm font-semibold text-white transition hover:bg-rose-600 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-rose-400"
            type="submit"
            value="confirm"
          >
            삭제
          </button>
        </form>
      </div>
    </dialog>
  </body>
</html>
