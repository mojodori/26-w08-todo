<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>To-Do 리스트</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    >
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="container todo-app py-5">
      <h1 class="text-center mb-4">To-Do 리스트</h1>

      <section class="mb-4" aria-label="전체 진행률">
        <p id="progress-text" class="mb-2">완료 0 / 전체 0 (0%)</p>
        <div
          class="progress"
          role="progressbar"
          aria-label="할 일 완료 진행률"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <div id="progress-bar" class="progress-bar" style="width: 0%"></div>
        </div>
      </section>

      <form id="todo-form" class="input-group mb-1">
        <label class="visually-hidden" for="todo-input">새 할 일</label>
        <input
          id="todo-input"
          class="form-control"
          type="text"
          maxlength="100"
          placeholder="할 일을 입력하세요"
          autocomplete="off"
        >
        <button class="btn btn-primary" type="submit">추가</button>
      </form>
      <p id="todo-error" class="text-danger small mb-3" role="alert" hidden>
        할 일을 입력해주세요
      </p>

      <div class="d-flex justify-content-center gap-2 mb-3" role="group" aria-label="할 일 필터">
        <button class="btn btn-primary filter-button" type="button" data-filter="ALL" aria-pressed="true">
          전체
        </button>
        <button class="btn btn-outline-primary filter-button" type="button" data-filter="ACTIVE" aria-pressed="false">
          진행 중
        </button>
        <button class="btn btn-outline-primary filter-button" type="button" data-filter="COMPLETED" aria-pressed="false">
          완료
        </button>
      </div>

      <ul id="todo-list" class="list-group" aria-label="할 일 목록"></ul>
      <p id="empty-message" class="empty-message text-center text-muted py-5 mb-0" hidden></p>
    </main>
  </body>
</html>
